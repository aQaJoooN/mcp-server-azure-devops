services:
  mcp-server:
    build: .
    image: mcp-server-azure-devops:local
    ports:
      - "3000:3000"
    environment:
      # Required – set these in a .env file or inline
      AZURE_DEVOPS_ORG_URL: "${AZURE_DEVOPS_ORG_URL}"
      AZURE_DEVOPS_AUTH_METHOD: "${AZURE_DEVOPS_AUTH_METHOD:-pat}"
      AZURE_DEVOPS_PAT: "${AZURE_DEVOPS_PAT:-}"
      # Optional
      AZURE_DEVOPS_API_VERSION: "${AZURE_DEVOPS_API_VERSION:-}"
      PORT: "3000"
      MCP_PATH: "/mcp"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
