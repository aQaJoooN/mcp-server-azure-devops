name: CI

on:
  push:
    paths-ignore:
      - '**/*.md'
      - '.agents/**'
      - 'skills-lock.json'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '.agents/**'
      - 'skills-lock.json'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Security Audit
        run: npm audit --audit-level=high --omit=dev

      - name: Format Check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit Tests
        run: npm run test:unit
