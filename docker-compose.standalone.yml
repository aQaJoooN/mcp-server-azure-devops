# Standalone docker-compose — pulls the pre-built image from Docker Hub.
#
# Usage:
#   1. Copy .env.example to .env and fill in your credentials
#   2. docker compose -f docker-compose.standalone.yml up -d
#   3. curl http://localhost:8888/healthz

services:
  mcp-server:
    image: aqajooon/mcp-server-azure-devops:latest
    container_name: mcp-azure-devops
    ports:
      - "8888:3000"
    environment:
      AZURE_DEVOPS_ORG_URL: "${AZURE_DEVOPS_ORG_URL:?AZURE_DEVOPS_ORG_URL must be set}"
      AZURE_DEVOPS_AUTH_METHOD: "${AZURE_DEVOPS_AUTH_METHOD:-pat}"
      AZURE_DEVOPS_PAT: "${AZURE_DEVOPS_PAT:-}"
      AZURE_DEVOPS_DEFAULT_PROJECT: "${AZURE_DEVOPS_DEFAULT_PROJECT:-}"
      AZURE_DEVOPS_API_VERSION: "${AZURE_DEVOPS_API_VERSION:-7.1}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
